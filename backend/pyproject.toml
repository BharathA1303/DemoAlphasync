[tool.ruff]
target-version = "py310"
line-length = 110
src = ["app", "tests/app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length handled by formatter/line-length setting; not a hard error
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# Milestone boundary: only app/kernel and app/shared exist so far. Widen
# this as later milestones add control_plane/runtime_plane/adapters.
files = ["app/kernel", "app/shared", "tests/app"]

[[tool.mypy.overrides]]
module = "tests.app.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests/app"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Non-functional requirement: 100% coverage on critical aggregates.
# Enforced per-module in CI as aggregates are introduced (Milestone 1B+);
# no blanket fail_under yet since most of the tree is still unimplemented.
show_missing = true
